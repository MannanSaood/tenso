[package]
name = "storage"
version = "0.1.0"
edition = "2024"
description = "DuckDB schema, migrations, and repository layer. The ONLY crate that touches raw SQL or the DuckDB Appender API."

[dependencies]
duckdb = { version = "1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
contention = { path = "../contention" }
ohlcv = { path = "../ohlcv" }
