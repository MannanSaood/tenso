[package]
name = "cli"
version = "0.1.0"
edition = "2024"
description = "Thin binary. clap subcommands: ingest, serve. The only crate permitted anyhow/unwrap outside tests."

[[bin]]
name = "block-analysis"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
axum = "0.7"
tracing = "0.1"
tracing-subscriber = "0.3"
duckdb = { version = "1", features = ["bundled"] }
ingest-core = { path = "../ingest-core" }
storage = { path = "../storage" }
contention = { path = "../contention" }
ohlcv = { path = "../ohlcv" }
api = { path = "../api" }
