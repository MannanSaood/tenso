[package]
name = "ingest-core"
version = "0.1.0"
edition = "2024"
description = "Solana RPC client, rate limiter, retry/backoff, and account-key resolution. No database code."

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
rand = "0.8"
tracing = "0.1"
futures = "0.3"
